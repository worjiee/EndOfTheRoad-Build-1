<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | End of the Road</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Enhanced viewport for better mobile compatibility -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
      /* Reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        position: fixed;
        top: 0;
        left: 0;
      }
      
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }

      /* Unity container styles */
      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #000;
      }
      
      #unity-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
        background-color: #000;
      }

      /* Universal mobile adjustments for all devices */
      @media screen and (max-width: 768px) {
        #unity-container {
          /* Set container to fill the entire screen */
          width: 100% !important;
          height: 100% !important;
          position: fixed !important;
          top: 0 !important;
          left: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
        }
        
        #unity-canvas {
          margin-top: -20px !important;
          transform: scale(0.95) !important;
          transform-origin: top center !important;
        }
        
        /* For extremely small screens */
        @media screen and (max-width: 350px) {
          #unity-canvas {
            transform: scale(0.9) !important;
            margin-top: -25px !important;
          }
        }
      }

      /* Desktop styles */
      @media screen and (min-width: 769px) {
        #unity-container {
          width: 960px;
          height: 600px;
          max-width: 95vw;
          max-height: 95vh;
          margin: auto;
        }
        
        #unity-canvas {
          width: 100% !important;
          height: 100% !important;
        }
      }

      /* Game lock overlay styles */
      #game-lock-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: white;
      }
      
      #unlock-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        background-color: #222;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        max-width: 90vw;
        width: 300px;
      }
      
      #unlock-code {
        padding: 12px;
        font-size: 18px;
        width: 100%;
        max-width: 200px;
        text-align: center;
        border: 2px solid #444;
        background-color: #333;
        color: #fff;
        border-radius: 5px;
      }
      
      #unlock-button {
        padding: 12px 24px;
        font-size: 18px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
        min-width: 120px;
      }
      
      #unlock-button:hover {
        background-color: #45a049;
      }
      
      #unlock-message {
        color: red;
        font-size: 16px;
        text-align: center;
        min-height: 20px;
      }

      /* Loading bar styles */
      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100;
      }
      
      #unity-logo {
        width: 154px;
        height: 130px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center / contain;
        margin: 0 auto 20px;
      }
      
      #unity-progress-bar-empty {
        width: 141px;
        height: 18px;
        margin: 0 auto;
        background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center / contain;
      }
      
      #unity-progress-bar-full {
        width: 0%;
        height: 18px;
        background: url('TemplateData/progress-bar-full-dark.png') no-repeat center / contain;
      }

      /* Footer styles - Hidden after loading */
      #unity-footer {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      
      /* Show footer only during loading */
      #unity-footer.loading {
        opacity: 1;
      }
      
      #unity-logo-title-footer {
        width: 80px;
        height: 80px;
        background: url('TemplateData/unity-logo-light.png') no-repeat center / contain;
      }
      
      #unity-fullscreen-button {
        width: 38px;
        height: 38px;
        background: url('TemplateData/fullscreen-button.png') no-repeat center / contain;
        cursor: pointer;
      }
      
      #unity-build-title {
        color: white;
        font-size: 16px;
        font-weight: bold;
      }

      /* Warning banner */
      #unity-warning {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: none;
      }

      /* Hide scrollbars and prevent overflow */
      html {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      
      html::-webkit-scrollbar {
        display: none;
      }

      /* Prevent zoom on double tap */
      * {
        touch-action: manipulation;
      }
      
      /* Safe area handling for notched devices */
      @supports (padding: max(0px)) {
        body {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
          padding-top: max(0px, env(safe-area-inset-top));
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <!-- Game Lock Overlay -->
    <div id="game-lock-overlay">
      <div id="unlock-form">
        <h2>Game Locked</h2>
        <p>Enter your unlock code to play</p>
        <input type="text" id="unlock-code" placeholder="Enter code" autocapitalize="characters">
        <button id="unlock-button">Unlock Game</button>
        <div id="unlock-message"></div>
      </div>
    </div>
    
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">End of the Road</div>
      </div>
    </div>
    
    <script>
      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBPaWpxyh5VGkHBORw0GmLr4vJEpn2X78k",
        authDomain: "websitepay-2681c.firebaseapp.com",
        databaseURL: "https://websitepay-2681c-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "websitepay-2681c",
        storageBucket: "websitepay-2681c.appspot.com",
        messagingSenderId: "728732104278",
        appId: "1:728732104278:web:5b2bfcb7bc8a50f7baf5d9"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
      
      // Game state
      let gameLocked = true;
      let unityInstance = null;
      
      // DOM Elements
      const lockOverlay = document.getElementById('game-lock-overlay');
      const unlockForm = document.getElementById('unlock-form');
      const unlockCode = document.getElementById('unlock-code');
      const unlockButton = document.getElementById('unlock-button');
      const unlockMessage = document.getElementById('unlock-message');
      
      // Auto uppercase for unlock code
      unlockCode.addEventListener('input', function() {
        this.value = this.value.toUpperCase();
      });
      
      // Function to check code in the database
      function checkCodeInDatabase(code) {
        unlockMessage.textContent = "Checking code...";
        
        database.ref('codes').once('value')
          .then((snapshot) => {
            let codeFound = false;
            let codeKey = null;
            
            snapshot.forEach((childSnapshot) => {
              const data = childSnapshot.val();
              console.log("Checking code entry:", data);
              if (data.code === code && data.used === false) {
                codeFound = true;
                codeKey = childSnapshot.key;
                console.log("Found valid code:", code, "with key:", codeKey);
                return true;
              }
            });
            
            if (codeFound && codeKey) {
              markCodeAsUsed(code, codeKey);
              unlockGame();
            } else {
              unlockMessage.textContent = "Invalid unlock code";
              console.log("Invalid code:", code);
            }
          })
          .catch((error) => {
            console.error("Error checking unlock code:", error);
            unlockMessage.textContent = "Error checking code. Please try again.";
          });
      }
      
      // Mark code as used in database
      function markCodeAsUsed(code, codeKey) {
        database.ref('codes/' + codeKey).update({
          used: true,
          usedAt: new Date().toISOString()
        }).then(() => {
          console.log("Code marked as used:", code);
        }).catch((error) => {
          console.error("Error marking code as used:", error);
        });
      }
      
      // Unlock game function
      function unlockGame() {
        gameLocked = false;
        lockOverlay.style.display = 'none';
        unlockMessage.textContent = "";
        
        // Notify Unity if loaded
        if (window.unityInstance) {
          try {
            window.unityInstance.SendMessage('GameManager', 'UnlockGame');
          } catch (e) {
            console.log("Unity message sending failed:", e);
          }
          
          // Auto fullscreen after short delay
          setTimeout(() => {
            try {
              window.unityInstance.SetFullscreen(1);
            } catch (e) {
              console.log("Fullscreen failed:", e);
            }
          }, 1000);
        }
      }
      
      // Lock game function
      function lockGame() {
        gameLocked = true;
        lockOverlay.style.display = 'flex';
        unlockCode.value = '';
      }
      
      // Event listeners for unlock functionality
      unlockButton.addEventListener('click', () => {
        const code = unlockCode.value.trim().toUpperCase();
        if (!code) {
          unlockMessage.textContent = "Please enter a code";
          return;
        }
        checkCodeInDatabase(code);
      });
      
      unlockCode.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          const code = unlockCode.value.trim().toUpperCase();
          if (!code) {
            unlockMessage.textContent = "Please enter a code";
            return;
          }
          checkCodeInDatabase(code);
        }
      });
      
      // Unity-related code
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // Banner display function
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/EndOfTheRoad-Build-.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/EndOfTheRoad-Build-.data",
        frameworkUrl: buildUrl + "/EndOfTheRoad-Build-.framework.js",
        codeUrl: buildUrl + "/EndOfTheRoad-Build-.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "End of the Road",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (isMobile) {
        // Mobile device style: fill the whole browser client area with the game canvas
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        
        // Better mobile performance
        config.devicePixelRatio = 1;
      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          window.unityInstance = instance; // Make it globally accessible
          
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          
          // Setup communication between Unity and JavaScript
          // Setup Unity communication
          window.lockGameFromUnity = function() {
            lockGame();
          };
          
          // Handle initial game state
          if (gameLocked) {
            lockOverlay.style.display = 'flex';
          } else {
            lockOverlay.style.display = 'none';
            setTimeout(() => {
              enterFullscreen();
            }, 1000);
          }

        }).catch((message) => {
          console.error("Unity loading failed:", message);
          alert("Failed to load game: " + message);
        });
      };

      script.onerror = () => {
        console.error("Failed to load Unity loader script");
        alert("Failed to load game scripts. Please check your internet connection.");
      };

      document.body.appendChild(script);

      // Prevent context menu on mobile
      if (isMobile) {
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Prevent pull-to-refresh on mobile
        document.body.addEventListener('touchstart', e => {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });
        
        document.body.addEventListener('touchend', e => {
          if (e.touches.length > 0) {
            e.preventDefault();
          }
        }, { passive: false });
        
        document.body.addEventListener('touchmove', e => {
          if (e.scale !== 1) {
            e.preventDefault();
          }
        }, { passive: false });
      }

    </script>
  </body>
</html>
