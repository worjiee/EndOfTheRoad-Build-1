<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | End of the Road</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Add fullscreen meta tag for better mobile experience -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <!-- Force landscape orientation on mobile devices -->
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape"><!-- QQ Browser -->
    <meta name="msapplication-orientation" content="landscape"><!-- IE/Edge -->
    <meta name="apple-mobile-web-app-capable" content="yes"><!-- iOS full-screen mode -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><!-- iOS status bar -->
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
      #game-lock-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: white;
      }
      #unlock-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        background-color: #222;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      }
      #unlock-code {
        padding: 10px;
        font-size: 18px;
        width: 200px;
        text-align: center;
        border: 2px solid #444;
        background-color: #333;
        color: #fff;
        border-radius: 5px;
      }
      #unlock-button {
        padding: 10px 20px;
        font-size: 18px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      #unlock-button:hover {
        background-color: #45a049;
      }
      #unlock-message {
        color: red;
        font-size: 16px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <script>
      // Lock screen orientation to landscape if supported
      function lockScreenOrientation() {
        try {
          // Try the Screen Orientation API
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function(error) {
              console.log('Screen orientation lock error:', error);
            });
          }
          // For iOS Safari which doesn't support the Screen Orientation API
          else if (window.orientation !== undefined) {
            // We can't force it, but we can detect orientation changes
            window.addEventListener('orientationchange', function() {
              if (window.orientation !== 90 && window.orientation !== -90) {
                alert('Please rotate your device to landscape mode for the best experience');
              }
            });
            // Check initial orientation
            if (window.orientation !== 90 && window.orientation !== -90) {
              alert('Please rotate your device to landscape mode for the best experience');
            }
          }
        } catch (e) {
          console.error('Error in orientation handling:', e);
        }
      }
    </script>
    <!-- Game Lock Overlay -->
    <div id="game-lock-overlay">
      <div id="unlock-form">
        <h2>Game Locked</h2>
        <p>Enter your unlock code to play</p>
        <input type="text" id="unlock-code" placeholder="Enter code">
        <button id="unlock-button">Unlock Game</button>
        <div id="unlock-message"></div>
      </div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">End of the Road</div>
      </div>
    </div>
    <script>
      // Firebase Configuration
      const firebaseConfig = {
        // You need to replace these values with your actual Firebase project config
        apiKey: "AIzaSyBPaWpxyh5VGkHBORw0GmLr4vJEpn2X78k", // Replace this with your new API key
  authDomain: "websitepay-2681c.firebaseapp.com",
  databaseURL: "https://websitepay-2681c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "websitepay-2681c",
  storageBucket: "websitepay-2681c.appspot.com",
  messagingSenderId: "728732104278",
  appId: "1:728732104278:web:5b2bfcb7bc8a50f7baf5d9"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
      
      // Game lock state
      let gameLocked = true;
      let unityInstance = null;
      let playerLives = 3; // Default lives, adjust as needed
      
      // DOM Elements
      const lockOverlay = document.getElementById('game-lock-overlay');
      const unlockForm = document.getElementById('unlock-form');
      const unlockCode = document.getElementById('unlock-code');
      const unlockButton = document.getElementById('unlock-button');
      const unlockMessage = document.getElementById('unlock-message');
      
      // Function to check code directly in the database
      function checkCodeInDatabase(code) {
        database.ref('codes').once('value')
          .then((snapshot) => {
            let codeFound = false;
            let codeKey = null;
            
            snapshot.forEach((childSnapshot) => {
              const data = childSnapshot.val();
              console.log("Checking code entry:", data);
              if (data.code === code && data.used === false) {
                codeFound = true;
                codeKey = childSnapshot.key;
                console.log("Found valid code:", code, "with key:", codeKey);
                return true; // Break the forEach loop
              }
            });
            
            if (codeFound && codeKey) {
              // Mark the code as used
              markCodeAsUsed(code, codeKey);
              
              // Unlock the game
              gameLocked = false;
              lockOverlay.style.display = 'none';
              unlockMessage.textContent = "";
              
              // Force landscape orientation on mobile
              if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                lockScreenOrientation();
              }
              
              // If Unity is already loaded, send message to reset/start game
              if (window.unityInstance) {
                window.unityInstance.SendMessage('GameManager', 'UnlockGame');
                // Auto enter fullscreen mode when game is unlocked
                setTimeout(() => {
                  window.unityInstance.SetFullscreen(1);
                }, 1000); // Small delay to ensure everything is loaded
              }
            } else {
              unlockMessage.textContent = "Invalid unlock code";
              console.log("Invalid code:", code);
            }
          })
          .catch((error) => {
            console.error("Error checking unlock code:", error);
            unlockMessage.textContent = "Error checking code";
          });
      }
      
      // Function to mark a code as used in the database
      function markCodeAsUsed(code, codeKey) {
        database.ref('codes/' + codeKey).update({
          used: true,
          usedAt: new Date().toISOString()
        }).then(() => {
          console.log("Code marked as used:", code);
        }).catch((error) => {
          console.error("Error marking code as used:", error);
        });
      }
      
      // Lock game function (called when lives are lost)
      function lockGame() {
        gameLocked = true;
        lockOverlay.style.display = 'flex';
        unlockCode.value = '';
      }
      
      // Event listener for unlock button
      unlockButton.addEventListener('click', () => {
        const code = unlockCode.value.trim();
        if (!code) {
          unlockMessage.textContent = "Please enter a code";
          return;
        }
        checkCodeInDatabase(code);
      });
      
      // Event listener for Enter key in the code input
      unlockCode.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          const code = unlockCode.value.trim();
          if (!code) {
            unlockMessage.textContent = "Please enter a code";
            return;
          }
          checkCodeInDatabase(code);
        }
      });

      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/EndOfTheRoad-Build-.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/EndOfTheRoad-Build-.data",
        frameworkUrl: buildUrl + "/EndOfTheRoad-Build-.framework.js",
        codeUrl: buildUrl + "/EndOfTheRoad-Build-.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "End of the Road",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // Add fullscreen preference to the config
        fullscreenMode: true
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      config.matchWebGLToCanvasSize = false; // Set to false to allow proper UI scaling

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        
        // Apply proper canvas styling for mobile devices with fixed aspect ratio
        var aspectRatio = 16/9; // Standard landscape aspect ratio
        var containerWidth = window.innerWidth;
        var containerHeight = window.innerHeight;
        
        // Calculate dimensions that maintain aspect ratio and fit screen
        var newWidth, newHeight;
        if (containerWidth / containerHeight > aspectRatio) {
          // Screen is wider than needed
          newHeight = containerHeight;
          newWidth = newHeight * aspectRatio;
        } else {
          // Screen is taller than needed
          newWidth = containerWidth;
          newHeight = newWidth / aspectRatio;
        }
        
        // Apply calculated dimensions
        canvas.style.width = newWidth + 'px';
        canvas.style.height = newHeight + 'px';
        
        // Center the canvas
        document.querySelector("#unity-container").style.width = newWidth + 'px';
        document.querySelector("#unity-container").style.height = newHeight + 'px';
        document.querySelector("#unity-container").style.margin = '0 auto';
        
        // Set background color to avoid white screen
        document.body.style.backgroundColor = '#000000';
        
        // Add window resize handler to maintain aspect ratio
        window.addEventListener('resize', function() {
          var containerWidth = window.innerWidth;
          var containerHeight = window.innerHeight;
          
          if (containerWidth / containerHeight > aspectRatio) {
            newHeight = containerHeight;
            newWidth = newHeight * aspectRatio;
          } else {
            newWidth = containerWidth;
            newHeight = newWidth / aspectRatio;
          }
          
          canvas.style.width = newWidth + 'px';
          canvas.style.height = newHeight + 'px';
          document.querySelector("#unity-container").style.width = newWidth + 'px';
          document.querySelector("#unity-container").style.height = newHeight + 'px';
        });
        
        // Try to lock screen orientation if supported
        if (!gameLocked) {
          lockScreenOrientation();
        }

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // Set a lower device pixel ratio for better performance while ensuring UI visibility
      config.devicePixelRatio = window.devicePixelRatio > 1 ? 1.5 : 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
        document.querySelector("#unity-container").style.margin = '0 auto';
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
                
                // Store Unity instance for communication
                window.unityInstance = unityInstance;
                
                // Setup communication between Unity and JavaScript
                window.lockGameFromUnity = function() {
                  lockGame();
                };
                
                // If game is locked at start, make sure overlay is visible
                if (gameLocked) {
                  lockOverlay.style.display = 'flex';
                } else {
                  lockOverlay.style.display = 'none';
                  // Auto enter fullscreen mode when game is unlocked
                  setTimeout(() => {
                    unityInstance.SetFullscreen(1);
                    // Force landscape orientation on mobile if not locked
                    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                      lockScreenOrientation();
                    }
                  }, 1000); // Small delay to ensure everything is loaded
                }

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
