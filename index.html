<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | End of the Road</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Enhanced viewport for better mobile compatibility -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
      /* Reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        position: fixed;
        top: 0;
        left: 0;
      }
      
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }

      /* Unity container styles */
      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #000;
      }
      
      #unity-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
        background-color: #000;
      }

      /* Mobile-specific adjustments with health bar visibility fix */
      @media screen and (max-width: 768px) {
        #unity-container {
          /* Ensure full viewport coverage on mobile */
          width: 100vw;
          height: calc(100vh - 40px); /* Reduce height to make room for health bar */
          height: calc(100dvh - 40px); /* Dynamic viewport height for newer browsers */
          position: fixed;
          top: 40px; /* Add space at top for health bar */
          left: 0;
          z-index: 1;
        }
        
        #unity-canvas {
          width: 100vw !important;
          height: calc(100vh - 40px) !important;
          height: calc(100dvh - 40px) !important;
          transform: translateY(-40px); /* Shift canvas up to reveal health bar */
        }
      }

      /* Desktop styles */
      @media screen and (min-width: 769px) {
        #unity-container {
          width: 960px;
          height: 600px;
          max-width: 95vw;
          max-height: 95vh;
          margin: auto;
        }
        
        #unity-canvas {
          width: 100% !important;
          height: 100% !important;
        }
      }

      /* Game lock overlay styles */
      #game-lock-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: white;
      }
      
      #unlock-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        background-color: #222;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        max-width: 90vw;
        width: 300px;
      }
      
      #unlock-code {
        padding: 12px;
        font-size: 18px;
        width: 100%;
        max-width: 200px;
        text-align: center;
        border: 2px solid #444;
        background-color: #333;
        color: #fff;
        border-radius: 5px;
      }
      
      #unlock-button {
        padding: 12px 24px;
        font-size: 18px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
        min-width: 120px;
      }
      
      #unlock-button:hover {
        background-color: #45a049;
      }
      
      #unlock-message {
        color: red;
        font-size: 16px;
        text-align: center;
        min-height: 20px;
      }

      /* Loading bar styles */
      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100;
      }
      
      #unity-logo {
        width: 154px;
        height: 130px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center / contain;
        margin: 0 auto 20px;
      }
      
      #unity-progress-bar-empty {
        width: 141px;
        height: 18px;
        margin: 0 auto;
        background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center / contain;
      }
      
      #unity-progress-bar-full {
        width: 0%;
        height: 18px;
        background: url('TemplateData/progress-bar-full-dark.png') no-repeat center / contain;
      }

      /* Footer styles - Hidden after loading */
      #unity-footer {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      
      /* Show footer only during loading */
      #unity-footer.loading {
        opacity: 1;
      }
      
      #unity-logo-title-footer {
        width: 80px;
        height: 80px;
        background: url('TemplateData/unity-logo-light.png') no-repeat center / contain;
      }
      
      #unity-fullscreen-button {
        width: 38px;
        height: 38px;
        background: url('TemplateData/fullscreen-button.png') no-repeat center / contain;
        cursor: pointer;
      }
      
      #unity-build-title {
        color: white;
        font-size: 16px;
        font-weight: bold;
      }

      /* Warning banner */
      #unity-warning {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: none;
      }

      /* Hide scrollbars and prevent overflow */
      html {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      
      html::-webkit-scrollbar {
        display: none;
      }

      /* Prevent zoom on double tap */
      * {
        touch-action: manipulation;
      }
      
      /* Safe area handling for notched devices */
      @supports (padding: max(0px)) {
        body {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
          padding-top: max(0px, env(safe-area-inset-top));
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <!-- Game Lock Overlay -->
    <div id="game-lock-overlay">
      <div id="unlock-form">
        <h2>Game Locked</h2>
        <p>Enter your unlock code to play</p>
        <input type="text" id="unlock-code" placeholder="Enter code" autocapitalize="characters" style="text-transform: uppercase;">
        <button id="unlock-button">Unlock Game</button>
        <div id="unlock-message"></div>
      </div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer" class="loading">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">End of the Road</div>
      </div>
    </div>

    <script>
      // Enhanced mobile detection and device info
      const isMobile = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);
      
      // Define a consistent health bar height for calculations
      const HEALTH_BAR_HEIGHT = 40;
      
      // Get actual device dimensions
      function getViewportDimensions() {
        return {
          width: window.innerWidth || document.documentElement.clientWidth,
          height: window.innerHeight || document.documentElement.clientHeight,
          screenWidth: window.screen ? window.screen.width : window.innerWidth,
          screenHeight: window.screen ? window.screen.height : window.innerHeight
        };
      }

      // Enhanced viewport setup for mobile devices
      function setupMobileViewport() {
        if (!isMobile) return;
        
        // Remove any existing viewport meta tags
        const existingViewport = document.querySelector('meta[name="viewport"]');
        if (existingViewport) {
          existingViewport.remove();
        }
        
        // Add optimized viewport meta tag
        const viewport = document.createElement('meta');
        viewport.name = 'viewport';
        viewport.content = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover';
        document.head.appendChild(viewport);
        
        // Prevent iOS Safari bottom bar from affecting layout
        if (isIOS) {
          document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
          
          window.addEventListener('resize', () => {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
          });
        }
        
        // Set body styles for mobile
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
        document.body.style.height = '100%';
        document.body.style.overflow = 'hidden';
        
        // Add mobile-specific class
        document.querySelector("#unity-container").className = "unity-mobile";
        document.querySelector("#unity-canvas").className = "unity-mobile";
      }

      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBPaWpxyh5VGkHBORw0GmLr4vJEpn2X78k",
        authDomain: "websitepay-2681c.firebaseapp.com",
        databaseURL: "https://websitepay-2681c-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "websitepay-2681c",
        storageBucket: "websitepay-2681c.appspot.com",
        messagingSenderId: "728732104278",
        appId: "1:728732104278:web:5b2bfcb7bc8a50f7baf5d9"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
      
      // Game state variables
      let gameLocked = true;
      let unityInstance = null;
      let playerLives = 3;
      
      // DOM Elements
      const lockOverlay = document.getElementById('game-lock-overlay');
      const unlockForm = document.getElementById('unlock-form');
      const unlockCode = document.getElementById('unlock-code');
      const unlockButton = document.getElementById('unlock-button');
      const unlockMessage = document.getElementById('unlock-message');
      
      // Auto uppercase for unlock code
      unlockCode.addEventListener('input', function() {
        this.value = this.value.toUpperCase();
      });
      
      // Database code checking function
      function checkCodeInDatabase(code) {
        unlockMessage.textContent = "Checking code...";
        
        database.ref('codes').once('value')
          .then((snapshot) => {
            let codeFound = false;
            let codeKey = null;
            
            snapshot.forEach((childSnapshot) => {
              const data = childSnapshot.val();
              console.log("Checking code entry:", data);
              if (data.code === code && data.used === false) {
                codeFound = true;
                codeKey = childSnapshot.key;
                console.log("Found valid code:", code, "with key:", codeKey);
                return true;
              }
            });
            
            if (codeFound && codeKey) {
              markCodeAsUsed(code, codeKey);
              unlockGame();
            } else {
              unlockMessage.textContent = "Invalid unlock code";
              console.log("Invalid code:", code);
            }
          })
          .catch((error) => {
            console.error("Error checking unlock code:", error);
            unlockMessage.textContent = "Error checking code. Please try again.";
          });
      }
      
      // Mark code as used in database
      function markCodeAsUsed(code, codeKey) {
        database.ref('codes/' + codeKey).update({
          used: true,
          usedAt: new Date().toISOString()
        }).then(() => {
          console.log("Code marked as used:", code);
        }).catch((error) => {
          console.error("Error marking code as used:", error);
        });
      }
      
      // Unlock game function
      function unlockGame() {
        gameLocked = false;
        lockOverlay.style.display = 'none';
        unlockMessage.textContent = "";
        
        // Setup mobile viewport if needed
        if (isMobile) {
          setupMobileViewport();
          
          // Add specific CSS for health bar visibility
          const healthBarStyle = document.createElement('style');
          healthBarStyle.textContent = `
            body::before {
              content: '';
              display: block;
              height: ${HEALTH_BAR_HEIGHT}px;
              width: 100%;
              background: transparent;
            }
            
            #unity-canvas {
              margin-top: -${HEALTH_BAR_HEIGHT}px !important;
            }
          `;
          document.head.appendChild(healthBarStyle);
        }
        
        // Notify Unity if loaded
        if (window.unityInstance) {
          try {
            window.unityInstance.SendMessage('GameManager', 'UnlockGame');
          } catch (e) {
            console.log("Unity message sending failed:", e);
          }
          
          // Auto fullscreen after short delay
          setTimeout(() => {
            try {
              enterFullscreen();
            } catch (e) {
              console.log("Fullscreen failed:", e);
            }
          }, 1000);
        }
      }
      
      // Lock game function
      function lockGame() {
        gameLocked = true;
        lockOverlay.style.display = 'flex';
        unlockCode.value = '';
        unlockMessage.textContent = '';
      }
      
      // Enhanced fullscreen function
      function enterFullscreen() {
        // First try browser fullscreen
        const element = document.documentElement;
        const requestFullscreen = element.requestFullscreen || 
                                element.webkitRequestFullscreen || 
                                element.mozRequestFullScreen || 
                                element.msRequestFullscreen;
        
        if (requestFullscreen) {
          requestFullscreen.call(element).catch(err => {
            console.log("Browser fullscreen failed:", err);
          });
        }
        
        // Then Unity fullscreen
        if (window.unityInstance) {
          try {
            window.unityInstance.SetFullscreen(1);
          } catch (e) {
            console.log("Unity fullscreen failed:", e);
          }
        }
      }
      
      // Event listeners for unlock functionality
      unlockButton.addEventListener('click', () => {
        const code = unlockCode.value.trim().toUpperCase();
        if (!code) {
          unlockMessage.textContent = "Please enter a code";
          return;
        }
        checkCodeInDatabase(code);
      });
      
      unlockCode.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          const code = unlockCode.value.trim().toUpperCase();
          if (!code) {
            unlockMessage.textContent = "Please enter a code";
            return;
          }
          checkCodeInDatabase(code);
        }
      });

      // Unity banner function
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Unity configuration
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/EndOfTheRoad-Build-.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/EndOfTheRoad-Build-.data",
        frameworkUrl: buildUrl + "/EndOfTheRoad-Build-.framework.js",
        codeUrl: buildUrl + "/EndOfTheRoad-Build-.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "End of the Road",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true,
        devicePixelRatio: isMobile ? 1 : window.devicePixelRatio || 1
      };

      // Initialize mobile viewport if needed
      if (isMobile) {
        setupMobileViewport();
      }

      // Enhanced resize handler for better responsiveness
      let resizeTimeout;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          if (isMobile) {
            setupMobileViewport();
          }
          
          // Update CSS custom properties for iOS
          if (isIOS) {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
          }
        }, 250);
      });

      // Show loading bar
      document.querySelector("#unity-loading-bar").style.display = "block";

      // Load Unity
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          
          // Hide the footer once game loads
          document.querySelector("#unity-footer").classList.remove("loading");
          
          // Setup fullscreen button (though it's now hidden)
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            enterFullscreen();
          };
          
          // Store Unity instance globally
          window.unityInstance = unityInstance;
          
          // Setup Unity communication
          window.lockGameFromUnity = function() {
            lockGame();
          };
          
          // Handle initial game state
          if (gameLocked) {
            lockOverlay.style.display = 'flex';
          } else {
            lockOverlay.style.display = 'none';
            setTimeout(() => {
              enterFullscreen();
            }, 1000);
          }

        }).catch((message) => {
          console.error("Unity loading failed:", message);
          alert("Failed to load game: " + message);
        });
      };

      script.onerror = () => {
        console.error("Failed to load Unity loader script");
        alert("Failed to load game scripts. Please check your internet connection.");
      };

      document.body.appendChild(script);

      // Prevent context menu on mobile
      if (isMobile) {
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Prevent pull-to-refresh on mobile
        document.body.addEventListener('touchstart', e => {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });
        
        document.body.addEventListener('touchend', e => {
          if (e.touches.length > 0) {
            e.preventDefault();
          }
        }, { passive: false });
        
        document.body.addEventListener('touchmove', e => {
          if (e.scale !== 1) {
            e.preventDefault();
          }
        }, { passive: false });
      }

    </script>
  </body>
</html>
